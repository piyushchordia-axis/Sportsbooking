name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sportsbooking
          POSTGRES_PASSWORD: sportsbooking
          POSTGRES_DB: sportsbooking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportsbooking"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://sportsbooking:sportsbooking@localhost:5432/sportsbooking?schema=public
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportsbooking/shared build
      - run: pnpm --filter @sportsbooking/api db:generate
      - run: pnpm typecheck
      - run: pnpm test
