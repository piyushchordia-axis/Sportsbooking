name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sportsbooking
          POSTGRES_PASSWORD: sportsbooking
          POSTGRES_DB: sportsbooking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportsbooking"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://sportsbooking:sportsbooking@localhost:5432/sportsbooking?schema=public
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportsbooking/shared build
      - run: pnpm --filter @sportsbooking/api db:generate
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sportsbooking
          POSTGRES_PASSWORD: sportsbooking
          POSTGRES_DB: sportsbooking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportsbooking"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # The app runs as the restricted sportsbooking_app role (created by db:push
      # from role-setup.sql, bootstrap password = its name) so CI exercises RLS
      # enforcement for real. DDL + seed use the admin/superuser role.
      DATABASE_URL: postgresql://sportsbooking_app:sportsbooking_app@localhost:5432/sportsbooking?schema=public
      DATABASE_ADMIN_URL: postgresql://sportsbooking:sportsbooking@localhost:5432/sportsbooking?schema=public
      JWT_SECRET: ci-secret
      NODE_ENV: development
      PGPASSWORD: sportsbooking
      CI: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportsbooking/shared build
      # Drizzle (not Prisma): db:push applies the schema, the RLS GUC functions,
      # the policy bodies + FORCE, and the restricted sportsbooking_app runtime
      # role in one step (it connects via DATABASE_ADMIN_URL for all DDL).
      - run: pnpm --filter @sportsbooking/api db:push
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts boots the full stack (pnpm dev: API :3001 + web) and
      # waits for E2E_BASE_URL. The dev Vite port is 5000.
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:5000
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
