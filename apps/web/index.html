<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Sportline — Book turf, courts & games near you</title>
    <script>
      // No-flash theme bootstrap: apply the saved/system mode to <html> before
      // styles load so the correct dark/light theme paints immediately. Kept in
      // sync with ThemeProvider (key: 'sportline-theme').
      (function () {
        try {
          var stored = localStorage.getItem('sportline-theme');
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var el = document.documentElement;
          el.classList.remove('light', 'dark');
          el.classList.add(mode);
        } catch (e) {
          /* default class on <html> stays as-is */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
