# Web tier for Sportline: serves the built Vite SPA and reverse-proxies the API.
# Runs on the HOST network and binds 127.0.0.1:8093 (loopback only) — the host's
# public Nginx terminates TLS for the subdomain and proxies here. The API is on
# 127.0.0.1:3001 (also host network). Single origin → the SPA's relative `/api`
# calls and uploaded-file links just work, no CORS.

# Preserve the proxy chain's scheme: trust the host Nginx's X-Forwarded-Proto
# (https), falling back to this hop's scheme when absent. (http context.)
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 127.0.0.1:8093;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 12m;

  # Security headers (server-level → applies to responses whose location has no
  # add_header of its own; nginx does NOT merge add_header across levels, so the
  # locations below that set their own headers repeat the security set). HSTS is
  # safe here because the public host Nginx terminates TLS in front. A full
  # resource-restricting CSP (script-src/etc.) needs testing against the SPA +
  # Razorpay and is intentionally deferred; frame-ancestors covers clickjacking.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/x-font-ttf font/woff2;

  # Fingerprinted build assets — cache hard. (add_header here overrides the
  # server-level set, so re-assert nosniff — the one that matters for JS/CSS.)
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # API: NestJS owns the whole /api/* surface (global prefix).
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;
  }

  # Uploaded files (logos/photos) served by the API's static mount.
  location /uploads/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    expires 7d;
    add_header Cache-Control "public";
  }

  # SPA fallback — every other path is client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached (it references fingerprinted bundles). This
  # location sets its own add_header, so re-assert the security set (nginx does
  # not inherit add_header when a location defines any) — this is THE document.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
}
