# Web tier for Sportline: serves the built Vite SPA and reverse-proxies the API.
# This container sits BEHIND the host's public Nginx (which terminates TLS for
# the subdomain and forwards in). Single origin → the SPA's relative `/api`
# calls and uploaded-file links just work, no CORS.

# Preserve the proxy chain's scheme: trust the host Nginx's X-Forwarded-Proto
# (https), falling back to this hop's scheme when absent. (http context — this
# file is included inside the main nginx.conf http block.)
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Don't leak the nginx version; sane upload ceiling (logo/photo uploads).
  server_tokens off;
  client_max_body_size 12m;

  # Docker's embedded DNS, so the `api` upstream resolves at request time and
  # survives the api container restarting with a new IP.
  resolver 127.0.0.11 ipv6=off valid=30s;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/x-font-ttf font/woff2;

  # Fingerprinted build assets — cache hard.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API: NestJS owns the whole /api/* surface (global prefix). Variable upstream
  # forces request-time DNS resolution via the resolver above.
  location /api/ {
    set $upstream http://api:3001;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;
  }

  # Uploaded files (logos/photos) are served by the API's static mount.
  location /uploads/ {
    set $upstream http://api:3001;
    proxy_pass $upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    expires 7d;
    add_header Cache-Control "public";
  }

  # SPA fallback — every other path is client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must never be cached (it references fingerprinted bundles).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
