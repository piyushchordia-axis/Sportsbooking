# Production stack for Sportline — mirrors the proven pattern already running on
# this host (jain-pathshala): app containers on the HOST network so they reach
# the host's Postgres on 127.0.0.1:5432 (TCP, password auth) without exposing it
# to Docker, and the host's public Nginx terminates TLS and proxies the
# subdomain to the web container on 127.0.0.1.
#
#   web (nginx)  -> 127.0.0.1:8093  serves the SPA, proxies /api + /uploads to api
#   api (nest)   -> 127.0.0.1:3001  /api, connects to host Postgres @127.0.0.1:5432
#   migrate      -> one-off: applies schema + RLS (db:push) and seeds (profile)
#
# Host networking lets the containers reach host Postgres over 127.0.0.1:5432
# (password auth). The API connects as the admin/owner role; RLS is enabled but
# not forced, so the owner bypasses it and tenant isolation is enforced in app
# code. Both services bind 127.0.0.1 only — nothing is exposed to the internet.
# Redis is intentionally absent — the app doesn't use it (Throttler is in-memory).
#
# Usage:
#   cp .env.production.example .env      # then fill DATABASE_URL(s) + JWT_SECRET
#   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d --build

name: sportsbooking

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sportsbooking-api:latest
    container_name: sportsbooking-api
    restart: unless-stopped
    init: true
    # Host net: reach Postgres on 127.0.0.1:5432; HOST=127.0.0.1 binds the API to
    # loopback only (not public). The host Nginx + web tier reach it via 3001.
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      API_PORT: "3001"
      # Local storage driver writes here (the code reads STORAGE_LOCAL_DIR,
      # resolved from cwd) — the mounted volume, so uploads persist across
      # rebuilds. STORAGE_LOCAL_BASE_URL (public URLs) is set per-domain in .env.
      STORAGE_LOCAL_DIR: /data/uploads
    volumes:
      - sb_uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: sportsbooking-web:latest
    container_name: sportsbooking-web
    restart: unless-stopped
    init: true
    # Host net: nginx binds 127.0.0.1:8093 and proxies to the API on 127.0.0.1:3001.
    # The host's public Nginx proxies the subdomain here.
    network_mode: host
    depends_on:
      - api

  # One-off schema/RLS apply + optional seed. Reuses the api image; runs as the
  # ADMIN role (DATABASE_ADMIN_URL) which db:push needs for DDL.
  #   db:push -> GUC funcs + schema + RLS enablement + policy bodies
  #   db:seed -> demo data (override the command)
  migrate:
    image: sportsbooking-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["tools"]
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
    command: ["pnpm", "db:push"]

volumes:
  sb_uploads:
