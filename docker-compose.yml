services:
  postgres:
    image: postgres:16
    container_name: sportsbooking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportsbooking
      POSTGRES_PASSWORD: sportsbooking
      POSTGRES_DB: sportsbooking
    ports:
      # Bind to loopback only — the dev DB must never be reachable off-host, even
      # if this compose is ever brought up on a networked machine.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsbooking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: sportsbooking-redis
    restart: unless-stopped
    ports:
      # Loopback only (no auth on this dev Redis).
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
