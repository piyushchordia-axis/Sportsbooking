<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1000" height="380" fill="#f8fafc"/>

  <!-- nav -->
  <rect width="1000" height="52" fill="#0f172a"/>
  <text x="24" y="32" fill="#ffffff" font-size="16" font-weight="700">🏟️ SportsBooking</text>
  <text x="932" y="32" fill="#ffffff" font-size="14" opacity="0.85">Login</text>

  <!-- card -->
  <rect x="294" y="92" width="412" height="252" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- tabs -->
  <rect x="314" y="112" width="120" height="34" rx="10" fill="#0ea5e9" opacity="0.5"/>
  <text x="374" y="134" fill="#ffffff" font-size="13" text-anchor="middle" opacity="0.9">Player (OTP)</text>
  <rect x="442" y="112" width="190" height="34" rx="10" fill="#0ea5e9"/>
  <text x="537" y="134" fill="#ffffff" font-size="13" text-anchor="middle">Owner / Staff / Admin</text>

  <!-- email field -->
  <text x="314" y="172" fill="#475569" font-size="13">Email</text>
  <rect x="314" y="180" width="372" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="326" y="203" fill="#0f172a" font-size="14">admin@sportsbooking.local</text>

  <!-- password field -->
  <text x="314" y="240" fill="#475569" font-size="13">Password</text>
  <rect x="314" y="248" width="372" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="326" y="271" fill="#0f172a" font-size="16" letter-spacing="2">•••••••••</text>

  <!-- sign in -->
  <rect x="314" y="296" width="92" height="34" rx="10" fill="#0ea5e9"/>
  <text x="360" y="318" fill="#ffffff" font-size="14" text-anchor="middle">Sign in</text>

  <!-- helper -->
  <text x="314" y="354" fill="#64748b" font-size="11">Seed: owner@smasharena.local / owner12345 · admin@sportsbooking.local / admin12345</text>
</svg>
