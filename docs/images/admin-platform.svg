<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1000" height="260" fill="#f8fafc"/>

  <!-- nav -->
  <rect width="1000" height="52" fill="#0f172a"/>
  <text x="24" y="32" fill="#ffffff" font-size="16" font-weight="700">🏟️ SportsBooking</text>
  <text x="200" y="32" fill="#ffffff" font-size="14" font-weight="700">Platform</text>
  <text x="290" y="32" fill="#ffffff" font-size="14" opacity="0.85">Games</text>
  <text x="360" y="32" fill="#ffffff" font-size="14" opacity="0.85">Owners</text>
  <text x="838" y="32" fill="#ffffff" font-size="13" opacity="0.8" text-anchor="end">Super Admin · super_admin</text>
  <text x="852" y="32" fill="#ffffff" font-size="14" opacity="0.85">Logout</text>

  <!-- card -->
  <rect x="40" y="76" width="920" height="160" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="108" fill="#0f172a" font-size="18" font-weight="700">Platform overview</text>

  <!-- stat grid (4 tiles) -->
  <g>
    <rect x="60" y="128" width="206" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="163" y="160" fill="#64748b" font-size="12" text-anchor="middle">Owners</text>
    <text x="163" y="190" fill="#0f172a" font-size="22" font-weight="700" text-anchor="middle">1</text>

    <rect x="278" y="128" width="206" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="381" y="160" fill="#64748b" font-size="12" text-anchor="middle">Venues</text>
    <text x="381" y="190" fill="#0f172a" font-size="22" font-weight="700" text-anchor="middle">1</text>

    <rect x="496" y="128" width="206" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="599" y="160" fill="#64748b" font-size="12" text-anchor="middle">Bookings</text>
    <text x="599" y="190" fill="#0f172a" font-size="22" font-weight="700" text-anchor="middle">24</text>

    <rect x="714" y="128" width="226" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="827" y="160" fill="#64748b" font-size="12" text-anchor="middle">Gross revenue</text>
    <text x="827" y="190" fill="#0f172a" font-size="22" font-weight="700" text-anchor="middle">₹38,400</text>
  </g>
</svg>
